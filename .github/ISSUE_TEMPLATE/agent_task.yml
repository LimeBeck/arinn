name: Agent task
description: A unit of work for one agent or contributor (ADR-0036)
labels: [task]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one task = one branch = one pull request. Agents create scoped issues for directed changes, or select roadmap work when the user authorizes it (AGENTS.md). Reviews do not require claiming a development task.
        Claim it with the label `agent:<name>` and a "claimed" comment naming the branch; a claim without activity for 48 hours may be taken over.
        Do not start while a dependency or an open question (OQ-xx) is unresolved; mark owner decisions with `needs-owner`.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is done.
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements
      description: AC-xx, G-x.y, R-xx, OQ-xx, ADR-NNNN this implements or affects.
      placeholder: G-1.1, AC-11
    validations:
      required: true
  - type: textarea
    id: zone
    attributes:
      label: Zone
      description: Paths this task may change. Before expanding the zone, check active issues and PRs and record the reason. An active claim, contract boundary or owner-gated decision requires separate coordination (CONTRIBUTING.md).
      placeholder: |
        plugins/desktop/**
        docs/architecture/plugin-runtime.md
    validations:
      required: true
  - type: textarea
    id: shared
    attributes:
      label: Shared files touched
      description: Contracts (crates/arinn-protocol, docs/plugin-api), specification sections, roadmap rows. A contract change is its own task labelled contract-change.
      placeholder: none
  - type: input
    id: adr
    attributes:
      label: Reserved ADR number
      description: If needed, record a free ADR number after checking the register and open issues/PRs. `python scripts/adr.py next` is not a lock; recheck before writing and publishing. Follow CONTRIBUTING.md for collisions.
      placeholder: none
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: "blocked by #12"
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests and evidence that prove the task is done.
    validations:
      required: true
