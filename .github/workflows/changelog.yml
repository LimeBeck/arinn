name: Changelog

# Every pull request adds a fragment under changes/ unless it is labelled
# skip-changelog or opened by Dependabot (ADR-0036). Separate from CI so
# label changes rerun only this check.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    name: Changelog fragment
    # Same runner switch as ci.yml (ADR-0049).
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    env:
      SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') || github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: No fragment required
        if: env.SKIP == 'true'
        run: echo "Labelled skip-changelog or opened by Dependabot; no fragment required."
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
        with:
          fetch-depth: 0
      - if: env.SKIP != 'true'
        # The checkout belongs to the runner user, not to root in the container.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/release.py check-fragment "origin/${{ github.base_ref }}"
