name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
  # Nightly run against the latest Arch Linux, Qt and Rust to catch
  # regressions from rolling dependencies before users update.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  integration:
    name: Qt shell and private-bus integration (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja \
            qt6-base qt6-declarative python nodejs dbus systemd
      - uses: actions/checkout@v4
      - name: Build Rust workspace
        run: cargo build --locked && cargo build --locked --examples
      - name: Build shell
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: KWin adapter tests
        run: node --test tests/integration/kwin_adapter.test.cjs
      - name: Private-bus integration suite
        run: dbus-run-session -- python tests/integration/phase1.py

  licenses:
    name: Licensing (REUSE, cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-docs.py
      - run: python scripts/adr.py check
      - run: python scripts/check-architecture.py
      - run: python scripts/release.py check

  package:
    name: Package
    uses: ./.github/workflows/package.yml
