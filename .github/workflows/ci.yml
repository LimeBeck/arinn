name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
  # Nightly run against the latest Arch Linux, Qt and Rust to catch
  # regressions from rolling dependencies before users update.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# Superseded PR runs cancel. Each master commit has its own group so every
# successful push can publish its snapshot (ADR-0086).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every job runs on `vars.ARINN_RUNNER` when that repository variable is set
# (for example `self-hosted`), else on GitHub-hosted Ubuntu (ADR-0049). Jobs
# run in containers, so a self-hosted runner needs only Docker and git.

jobs:
  # A pull request that changes only documentation skips the build jobs
  # (ADR-0044). Skipped jobs still report their required checks as passed.
  # Build jobs run unless the scope is positively docs-only, so a failure
  # of this job falls back to the full pipeline instead of skipping it.
  scope:
    name: Change scope
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        # The checkout belongs to the runner user, not to root in the
        # container; without this git fails and the scope falls back to a
        # full run.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-scope.py

  rust:
    name: Rust (fmt, clippy, test)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: rust:1
    steps:
      - name: Install dependencies
        # The tests start private session buses with dbus-daemon and check
        # interface XML with Python.
        run: apt-get update && apt-get install -y --no-install-recommends dbus python-is-python3 libssl-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  integration:
    name: Qt shell and private-bus integration (Arch Linux)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja \
            qt6-base qt6-declarative qt6-svg qt6-tools curl libunwind openssl python nodejs dbus systemd xorg-server-xvfb
      - uses: actions/checkout@v7
      - name: Build Rust workspace
        run: cargo build --locked && cargo build --locked --examples
      - name: Isolated X11 EWMH tests
        env:
          ARINN_XVFB: /usr/bin/Xvfb
        run: cargo test --locked -p arinn-platform-x11 -- --include-ignored
      - name: Build shell
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: QML component tests
        run: ctest --test-dir build --output-on-failure
      - name: KWin adapter and Chrome extension tests
        run: node --test tests/integration/kwin_adapter.test.cjs tests/integration/chrome_extension.test.cjs
      - name: Private-bus integration suite
        run: dbus-run-session -- python tests/integration/phase1.py

  licenses:
    name: Licensing (REUSE, cargo-deny)
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    # Every job runs in a container: container jobs leave root-owned files
    # in the shared workspace that a host-level job could not clean.
    container: python:3.12
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  docs:
    name: Documentation consistency
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/check-docs.py
      - run: python scripts/adr.py check
      - run: python scripts/check-architecture.py
      - run: python scripts/release.py check
      - run: python -m unittest discover -s tests/ci

  package:
    name: Package
    needs: scope
    # The reusable workflow skips its own jobs, so its nested required
    # checks are reported as skipped instead of never appearing.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/package.yml
    with:
      # Pull requests build the package only when they touch it (ADR-0049);
      # run CI manually on the branch to force a package build.
      skip: ${{ needs.scope.outputs.package != 'true' }}

  snapshot:
    name: Publish master pre-release
    # Share the channel lock with post-publication retention; older CI can
    # finish later, but its snapshot may not replace a newer verified commit.
    concurrency:
      group: arinn-master-snapshot-channel
      queue: max
      cancel-in-progress: false
    needs: [scope, rust, integration, licenses, docs, package]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-package
          path: dist
      - name: Prepare immutable snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/snapshot-release.py prepare
      - uses: softprops/action-gh-release@v3
        id: upload
        if: steps.snapshot.outputs.already_published != 'true'
        with:
          token: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
          tag_name: ${{ steps.snapshot.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Arinn ${{ steps.snapshot.outputs.tag }}
          body_path: snapshot-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
      - name: Verify assets and publish pre-release
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: python scripts/snapshot-release.py publish
