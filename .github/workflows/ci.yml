name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
  # Nightly run against the latest Arch Linux, Qt and Rust to catch
  # regressions from rolling dependencies before users update.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  # Container jobs pull the CI images from ghcr.io (ADR-0104).
  packages: read

# Superseded PR runs cancel. Each master commit has its own group so every
# successful push can publish its snapshot (ADR-0086); a second push run for
# the same commit cancels the first instead of repeating it (ADR-0092).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

env:
  CARGO_TERM_COLOR: always

# Every job runs on `vars.ARINN_RUNNER` when that repository variable is set
# (for example `self-hosted`), else on GitHub-hosted Ubuntu (ADR-0049). Jobs
# run in containers, so a self-hosted runner needs only Docker and git. The
# Arch Linux and Ubuntu jobs use prebuilt images with their dependencies
# from ci/images/** (ADR-0104).

jobs:
  # PRs use docs, website, visual or full checks (proposed ADR-0145).
  # Native inputs and failed/unknown classification keep the full pipeline.
  # Existing required check names still report, including skipped checks.
  scope:
    name: Change scope
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      native: ${{ steps.scope.outputs.native }}
      website: ${{ steps.scope.outputs.website }}
      visual: ${{ steps.scope.outputs.visual }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        # The checkout belongs to the runner user, not to root in the
        # container; without this git fails and the scope falls back to a
        # full run.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci-scope.py

  # Builds the CI images that do not exist yet for this commit's
  # ci/images/** (ADR-0104).
  images:
    name: CI images
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native != 'false' || needs.scope.outputs.visual == 'true') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml

  # One Arch Linux job compiles the workspace once for the Rust lints and
  # tests, the Qt shell and the private-bus suite (ADR-0092). The Cargo home,
  # the Cargo target directory and ccache live in /ci-cache: a directory on
  # the self-hosted runner's disk, or the GitHub cache on hosted runners
  # (ADR-0101); each self-hosted runner instance has its own target directory
  # (ADR-0113). A cache miss only means a full build.
  build:
    name: Rust, Qt shell and integration (Arch Linux)
    needs: [scope, images]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native != 'false' || needs.scope.outputs.visual == 'true') }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.images.outputs.arch_build }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/cache/arinn-ci/arch-ci:/ci-cache
    env:
      # Never /github/home/.cargo: on the self-hosted runner that home is
      # shared with other jobs, including rustup proxies from the Debian job.
      CARGO_HOME: /ci-cache/cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CCACHE_DIR: /ci-cache/ccache
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Update to the latest Arch Linux
        # The image has every dependency (ci/images/arch). The nightly
        # upgrades it so regressions from rolling dependencies show up before
        # users update (ADR-0033, ADR-0104).
        if: ${{ github.event_name == 'schedule' }}
        run: pacman -Syu --noconfirm
      - uses: actions/checkout@v7
      - name: Install Qt Multimedia for interface sounds
        # Until the Arch CI image is rebuilt with qt6-multimedia (ci/images/arch).
        run: pacman -S --noconfirm --needed qt6-multimedia
      - name: Restore build cache
        # The self-hosted runner keeps /ci-cache on its own disk.
        if: ${{ !vars.ARINN_RUNNER && (needs.scope.result != 'success' || needs.scope.outputs.native != 'false') }}
        uses: actions/cache/restore@v4
        with:
          path: /ci-cache
          key: ci-cache-arch-${{ github.run_id }}
          restore-keys: ci-cache-arch-
      - name: Link the cached target directory
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        # tests/integration/phase1.py runs ./target/debug binaries. A target
        # directory past 12 GB is dropped so stale artifacts cannot fill the
        # runner's disk. Each self-hosted runner instance gets its own target
        # directory: instances on one host share /ci-cache, and a job on one
        # of them overwrote another's artifacts while its tests ran (ADR-0113).
        env:
          RUNNER_SLOT: ${{ vars.ARINN_RUNNER && runner.name || '' }}
        run: |
          target=/ci-cache/target
          if [ -n "$RUNNER_SLOT" ]; then target="$target-$(printf '%s' "$RUNNER_SLOT" | tr -c 'A-Za-z0-9_.-' '_')"; fi
          mkdir -p "$target"
          if [ "$(du -s --block-size=1G "$target" | cut -f1)" -gt 12 ]; then rm -rf "$target"; mkdir "$target"; fi
          ln -sfn "$target" target
      - run: cargo fmt --all --check
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
      - name: Package symbol collector tests
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        # Tiny synthetic C/Rust fixtures only; no package or Arinn rebuild.
        run: python -m unittest discover -s tests/ci -p test_debug_symbols.py
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
      - run: cargo test --locked
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
      - name: Build Rust workspace
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        run: cargo build --locked && cargo build --locked --examples
      - name: Isolated X11 EWMH tests
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        # cargo test above ran the others; these need Xvfb.
        env:
          ARINN_XVFB: /usr/bin/Xvfb
        run: cargo test --locked -p arinn-platform-x11 -- --ignored
      - name: Build shell
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja
          cmake --build build
          ccache --show-stats
      - name: Save build cache
        # Pull request and tag caches are visible only to their own ref;
        # master pushes and the nightly keep one shared cache warm.
        if: ${{ !vars.ARINN_RUNNER && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        uses: actions/cache/save@v4
        with:
          path: /ci-cache
          key: ci-cache-arch-${{ github.run_id }}
      - name: QML component tests
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        run: ctest --test-dir build --output-on-failure
      - name: KWin adapter and Chrome extension tests
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        run: node --test tests/integration/kwin_adapter.test.cjs tests/integration/chrome_extension.test.cjs
      - name: Private-bus integration suite
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.native != 'false' }}
        run: dbus-run-session -- python tests/integration/phase1.py
      # Reuse the existing required check name: a failed render must fail
      # that check, rather than leave it skipped beside a new optional job.
      - name: Validate visual fixture manifest
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.visual == 'true' }}
        run: python scripts/ui-compare.py --check
      - name: Build visual fixture renderer
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.visual == 'true' }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target arinn-ui-test
      - name: Render visual fixtures at 1080p and 4K
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.visual == 'true' }}
        run: |
          env -u ARINN_CAPTURE_ONLY python scripts/ui-compare.py --build-dir build --output build/visual-ci
          test -s build/visual-ci/report.html
          test -s build/visual-ci/summary.md
      - name: Save visual fixture evidence
        if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.visual == 'true' }}
        uses: actions/upload-artifact@v8
        with:
          name: visual-fixture-renders
          path: build/visual-ci
          if-no-files-found: error
          retention-days: 7

  licenses:
    name: Licensing (REUSE, cargo-deny)
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    # Every job runs in a container: container jobs leave root-owned files
    # in the shared workspace that a host-level job could not clean.
    container: python:3.12
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      # Every section of deny.toml: licenses, advisories, bans and sources
      # (#613).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    name: Documentation consistency
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/check-docs.py
      - run: python scripts/adr.py check
      - run: python scripts/check-architecture.py
      - run: python scripts/release.py check
      - run: python -m unittest discover -s tests/ci
      - name: Validate public website
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.website == 'true' }}
        run: |
          python scripts/check-user-site.py
          python scripts/build-site.py
          python scripts/check-site.py

  package:
    name: Package
    needs: [scope, images]
    # The reusable workflow skips its own jobs, so its nested required
    # checks are reported as skipped instead of never appearing.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/package.yml
    with:
      # Pull requests never build the packages (ADR-0102); run CI manually
      # on the branch to check a packaging change before it merges.
      skip: ${{ needs.scope.outputs.package != 'true' }}
      arch_build_image: ${{ needs.images.outputs.arch_build }}
      arch_smoke_image: ${{ needs.images.outputs.arch_smoke }}
      deb_build_image: ${{ needs.images.outputs.ubuntu_build }}
      deb_smoke_image: ${{ needs.images.outputs.ubuntu_smoke }}

  symbols:
    name: Upload package-matched Sentry symbols
    needs: [scope, images, build, licenses, docs, package]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container:
      image: ${{ needs.images.outputs.arch_build }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-symbols
          path: symbols/arch
      - uses: actions/download-artifact@v8
        with:
          name: arinn-deb-symbols
          path: symbols/debian
      - name: Upload verified ELF debug files
        env:
          # No token is passed to build, test or PR jobs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/debug-symbols.py upload symbols --build-id "$(python scripts/build_id.py)"

  snapshot:
    name: Publish master pre-release
    # Share the channel lock with post-publication retention; older CI can
    # finish later, but its snapshot may not replace a newer verified commit.
    concurrency:
      group: arinn-master-snapshot-channel
      queue: max
      cancel-in-progress: false
    needs: [scope, images, build, licenses, docs, package, symbols]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-package
          path: incoming
      - name: Stage distributable assets
        run: python scripts/stage-release-assets.py incoming dist
      - name: Prepare immutable snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/snapshot-release.py prepare
      - uses: softprops/action-gh-release@v3
        id: upload
        if: steps.snapshot.outputs.already_published != 'true'
        with:
          token: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
          tag_name: ${{ steps.snapshot.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Arinn ${{ steps.snapshot.outputs.tag }}
          body_path: snapshot-notes.md
          draft: true
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
      - name: Verify assets and publish pre-release
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: python scripts/snapshot-release.py publish
