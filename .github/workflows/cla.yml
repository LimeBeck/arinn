name: CLA

# Contributors sign CLA.md once by commenting on a pull request.
# Signatures are stored in the `cla-signatures` branch of this repository.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/LimeBeck/arinn/blob/master/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Commits by AI agents operated by the maintainer are covered by the
          # maintainer's own rights (ADR-0036). GitHub resolves the Claude agent's
          # commit email to the login "claude"; matching is case-sensitive, so
          # both the login and the unlinked git name are listed.
          allowlist: LimeBeck,claude,Claude,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
