name: Package

# Reusable: builds the Arch Linux package and a Debian .deb from the
# checked-out commit and verifies each by installing it into a clean system
# (ADR-0033, ADR-0091). Arch remains the release blocker; the .deb is an
# additional artifact and smoke target. Pull requests and master reuse a
# Cargo cache; pull requests and master pushes skip release-mode package
# tests, which the build job already covers. The nightly, manual runs and tag
# builds run them; tag builds are clean (ADR-0047, ADR-0092).

on:
  workflow_call:
    inputs:
      skip:
        description: Skip the build (documentation-only change, ADR-0044, or a pull request that does not touch the package, ADR-0049)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Arch package
    if: ${{ !inputs.skip }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container:
      image: archlinux:latest
      # The Cargo home and target directory stay on the self-hosted runner's
      # disk (ADR-0101).
      volumes:
        - /var/cache/arinn-ci/arch-pkg:/ci-cache
    steps:
      - name: Install build dependencies
        id: deps
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja \
            qt6-base qt6-declarative qt6-svg qt6-tools curl libunwind openssl python dbus
          useradd --create-home builder
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          # The snapshot pkgver counts commits (#357).
          fetch-depth: 0
      - name: Restore Cargo cache
        # Tag builds start clean; the self-hosted runner keeps /ci-cache.
        if: ${{ github.ref_type != 'tag' && !vars.ARINN_RUNNER }}
        uses: actions/cache@v4
        with:
          path: /ci-cache
          key: arinn-pkg-${{ steps.deps.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: arinn-pkg-${{ steps.deps.outputs.rustc }}-
      - name: Create source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A tag builds the release version; every other build is a snapshot
          # whose pkgver pacman orders by commit (#357, ADR-0097).
          if [ "${{ github.ref_type }}" = tag ]; then
            pkgver="$(python scripts/release.py version)"
          else
            pkgver="$(python scripts/build_id.py --pkgver)"
          fi
          mkdir -p pkg
          git archive --format=tar.gz --prefix="arinn-${pkgver}/" -o "pkg/arinn-${pkgver}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/arinn.install pkg/
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" pkg/PKGBUILD
          grep -qx "pkgver=${pkgver}" pkg/PKGBUILD
          chown -R builder pkg
      - name: makepkg (build, check, package)
        env:
          # Release-mode check() repeats the Rust job's cargo test, so pull
          # requests and master pushes skip it; the nightly, manual runs and
          # tag builds run it (ADR-0047, ADR-0092).
          NOCHECK: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag')) && '--nocheck' || '' }}
        run: |
          cache=/ci-cache
          if [ "$GITHUB_REF_TYPE" = tag ]; then cache="$GITHUB_WORKSPACE/cargo-cache"; fi
          mkdir -p "$cache/home" "$cache/target"
          # A target directory past 12 GB is dropped so stale artifacts
          # cannot fill the runner's disk.
          if [ "$(du -s --block-size=1G "$cache/target" | cut -f1)" -gt 12 ]; then rm -rf "$cache/target"; mkdir "$cache/target"; fi
          chown -R builder "$cache"
          su builder -c "cd pkg && CARGO_HOME='$cache/home' CARGO_TARGET_DIR='$cache/target' makepkg --noconfirm --cleanbuild $NOCHECK"
          cp "$cache/target/release/examples/private-systemd" pkg/private-systemd
      - uses: actions/upload-artifact@v7
        with:
          name: arinn-arch-package
          path: |
            pkg/*.pkg.tar.zst
            pkg/*.tar.gz
            pkg/private-systemd
          if-no-files-found: error

  smoke:
    name: Install and smoke-test package
    needs: build
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-package
          path: pkg
      - name: Install package into a clean system
        run: |
          pacman -Syu --noconfirm --needed python dbus
          pacman -U --noconfirm pkg/*.pkg.tar.zst
      - name: Smoke test
        env:
          ARINN_TEST_MANAGER: ${{ github.workspace }}/pkg/private-systemd
        run: chmod +x "$ARINN_TEST_MANAGER" && dbus-run-session -- python tests/package/smoke.py
      - name: Session units and KWin adapter loader
        run: python tests/package/session.py
      - name: Uninstall cleanly
        run: |
          python tests/package/uninstall.py --self-check
          python tests/package/uninstall.py

  build-deb:
    name: Build Debian package
    if: ${{ !inputs.skip }}
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container:
      image: ubuntu:25.04
      # The rustup toolchain, Cargo home and target directory stay on the
      # self-hosted runner's disk (ADR-0101).
      volumes:
        - /var/cache/arinn-ci/deb:/ci-cache
    env:
      # Never /github/home: on the self-hosted runner it is shared with the
      # other jobs, which must not see rustup's proxies.
      CARGO_HOME: /ci-cache/cargo
      RUSTUP_HOME: /ci-cache/rustup
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 ca-certificates curl debhelper-compat cmake g++ ninja-build \
            pkg-config qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libcurl4-openssl-dev libunwind-dev libssl-dev devscripts
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Record Rust version
        id: deps
        run: echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Trust workspace for git archive
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore Cargo cache
        if: ${{ github.ref_type != 'tag' && !vars.ARINN_RUNNER }}
        uses: actions/cache@v4
        with:
          path: /ci-cache/target
          key: arinn-deb-${{ steps.deps.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: arinn-deb-${{ steps.deps.outputs.rustc }}-
      - name: Build .deb
        env:
          # Tag builds start from an empty target directory.
          CARGO_TARGET_DIR: ${{ github.ref_type == 'tag' && format('{0}/cargo-target', github.workspace) || '/ci-cache/target' }}
          # Same check() policy as the Arch package (ADR-0092).
          DEB_BUILD_OPTIONS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type != 'tag')) && 'nocheck' || '' }}
        run: |
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          # A target directory past 12 GB is dropped so stale artifacts
          # cannot fill the runner's disk.
          if [ "$(du -s --block-size=1G "$CARGO_TARGET_DIR" | cut -f1)" -gt 12 ]; then rm -rf "$CARGO_TARGET_DIR"; mkdir "$CARGO_TARGET_DIR"; fi
          chmod +x packaging/debian/build-deb.sh packaging/debian/debian/rules packaging/debian/debian/postinst
          ./packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arinn-deb-package
          path: |
            packaging/debian/*.deb
            packaging/debian/private-systemd
          if-no-files-found: error

  smoke-deb:
    name: Install and smoke-test Debian package
    needs: build-deb
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arinn-deb-package
          path: pkg
      - name: Install package into a clean system
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 dbus
          apt-get install -y ./pkg/*.deb
      - name: Smoke test
        env:
          ARINN_TEST_MANAGER: ${{ github.workspace }}/pkg/private-systemd
        run: chmod +x "$ARINN_TEST_MANAGER" && dbus-run-session -- python3 tests/package/smoke.py
      - name: Session units and KWin adapter loader
        run: python3 tests/package/session.py
      - name: Uninstall cleanly
        run: |
          python3 tests/package/uninstall.py --self-check
          ARINN_PACKAGE_MANAGER=deb python3 tests/package/uninstall.py
