name: Package

# Reusable: builds the Arch Linux package from the checked-out commit and
# verifies it by installing it into a clean system (ADR-0033). Pull requests
# and master reuse a Cargo cache; pull requests skip the release-mode
# check(), which the Rust job already covers. Tag builds are clean and run
# check() (ADR-0047).

on:
  workflow_call:
    inputs:
      skip:
        description: Skip the build for a documentation-only change (ADR-0044)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Arch package
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        id: deps
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cmake ninja \
            qt6-base qt6-declarative qt6-svg python dbus
          useradd --create-home builder
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: Restore Cargo cache
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@v4
        with:
          path: cargo-cache
          key: arinn-pkg-${{ steps.deps.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: arinn-pkg-${{ steps.deps.outputs.rustc }}-
      - name: Create source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(python scripts/release.py version)"
          mkdir -p pkg
          git archive --format=tar.gz --prefix="arinn-${version}/" -o "pkg/arinn-${version}.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/arinn.install pkg/
          chown -R builder pkg
      - name: makepkg (build, check, package)
        env:
          NOCHECK: ${{ github.event_name == 'pull_request' && '--nocheck' || '' }}
        run: |
          cache="$GITHUB_WORKSPACE/cargo-cache"
          mkdir -p "$cache/home" "$cache/target"
          chown -R builder "$cache"
          su builder -c "cd pkg && CARGO_HOME='$cache/home' CARGO_TARGET_DIR='$cache/target' makepkg --noconfirm --cleanbuild $NOCHECK"
          cp "$cache/target/release/examples/private-systemd" pkg/private-systemd
      - uses: actions/upload-artifact@v7
        with:
          name: arinn-arch-package
          path: |
            pkg/*.pkg.tar.zst
            pkg/*.tar.gz
            pkg/private-systemd
          if-no-files-found: error

  smoke:
    name: Install and smoke-test package
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-package
          path: pkg
      - name: Install package into a clean system
        run: |
          pacman -Syu --noconfirm --needed python dbus
          pacman -U --noconfirm pkg/*.pkg.tar.zst
      - name: Smoke test
        env:
          ARINN_TEST_MANAGER: ${{ github.workspace }}/pkg/private-systemd
        run: chmod +x "$ARINN_TEST_MANAGER" && dbus-run-session -- python tests/package/smoke.py
      - name: Session units and KWin adapter loader
        run: python tests/package/session.py
      - name: Uninstall cleanly
        run: |
          pacman -R --noconfirm arinn
          test ! -e /usr/bin/arinnd
          test ! -e /usr/lib/systemd/user/arinn-session.target
          test ! -e /usr/lib/arinn/arinn-kwin-adapter
