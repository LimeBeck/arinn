name: Release

# Publishes a GitHub release for a tag vX.Y.Z only after the full CI suite,
# including the package build and install smoke test, passes on that commit.
# Jobs run in containers like CI, so a self-hosted runner (ARINN_RUNNER,
# ADR-0049) needs only Docker and git.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    name: Version and changelog
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    steps:
      - uses: actions/checkout@v7
      # The checkout belongs to the runner user, not to root in the container.
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/release.py check "${GITHUB_REF_NAME}"

  ci:
    name: Full CI
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: [check, ci]
    runs-on: ${{ vars.ARINN_RUNNER || 'ubuntu-latest' }}
    container: python:3.12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: arinn-arch-package
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: arinn-deb-package
          path: dist
      - name: Checksums and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum * > SHA256SUMS)
          python scripts/release.py notes "$version" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: Arinn ${{ github.ref_name }}
          body_path: notes.md
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
