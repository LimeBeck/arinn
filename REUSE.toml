# Licensing annotations for files that cannot carry an inline SPDX header.
# Policy: docs/adr/0029-licensing.md

version = 1
SPDX-PackageName = "Arinn"
SPDX-PackageDownloadLocation = "https://github.com/LimeBeck/arinn"

# Documentation, specifications, ADRs and design materials.
[[annotations]]
path = ["docs/**", "*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Arinn contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Plugin API interface definitions are licensed like the protocol crate.
[[annotations]]
path = "docs/plugin-api/**.xml"
precedence = "override"
SPDX-FileCopyrightText = "2026 Arinn contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Third-party service logos embedded in the design prototype.
[[annotations]]
path = "docs/design/**/.image-slots.state.json"
precedence = "override"
SPDX-FileCopyrightText = "Respective trademark owners"
SPDX-License-Identifier = "LicenseRef-Third-Party-Trademarks"

# Generated files and trivial configuration.
[[annotations]]
path = ["Cargo.lock", ".gitignore", ".editorconfig", "deny.toml", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Arinn contributors"
SPDX-License-Identifier = "CC0-1.0"
