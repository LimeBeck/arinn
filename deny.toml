# Dependency policy checked by `cargo deny check` in CI.
# Every dependency must be compatible with GPL-3.0-or-later and, for
# crates/arinn-protocol, with MIT OR Apache-2.0 (see docs/adr/0029-licensing.md).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "GPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
