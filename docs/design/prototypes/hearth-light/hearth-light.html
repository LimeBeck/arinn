<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arinn — Hearth light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300..700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
<!-- candidates for the content-title face (font lab, 2026-11-02): all OFL with Cyrillic -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Cormorant+Garamond:wght@300..700&family=Prata&family=Bona+Nova:wght@400;700&family=Ysabeau:wght@100..1000&family=Piazzolla:opsz,wght@8..30,100..900&family=Brygada+1918:wght@400..700&family=Tenor+Sans&family=Jost:wght@100..900&family=Geologica:wght@100..900&display=swap" rel="stylesheet">
<style>
@font-face { font-family: Onest; src: url('../../../../apps/arinn-shell/ui/fonts/Onest.ttf') format('truetype'); font-weight: 100 900; }
@property --pool-x { syntax: '<length>'; inherits: false; initial-value: 960px; }
@property --pool-c { syntax: '<color>'; inherits: false; initial-value: rgb(0 0 0 / 0); }
@property --base-c { syntax: '<color>'; inherits: false; initial-value: rgb(0 0 0 / 0); }
@property --glow-c { syntax: '<color>'; inherits: false; initial-value: rgb(0 0 0 / 0); }

:root { --ease: cubic-bezier(.2,.8,.2,1); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body {
  font-family: Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  --bg: #0F1115; --t1: oklch(.95 .008 75); --t2: oklch(.80 .008 75); --t3: oklch(.66 .008 75);
  --ember: #FF8A3D; --ink: #131417; --chip: #1C1E23;
}
body.tok-current { --bg: #131416; --t1: #F4F5F7; --t2: #C9CBCF; --t3: #9A9DA3; }
body.tok-hearth.tod-night { --t1: oklch(.84 .008 75); --t2: oklch(.71 .008 75); --t3: oklch(.60 .008 75); }
body.motion-reduced * { transition-duration: 1ms !important; animation: none !important; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg); color: var(--t1); transform-origin: 50% 50%;
}
svg.i { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- layers ---------- */
#bgapp { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0;
  transform: scale(.90); filter: blur(36px) brightness(.32); transition: opacity 400ms var(--ease), transform 500ms var(--ease), filter 500ms var(--ease); }
#bgapp.on { opacity: 1; }
#bgapp.near { transform: scale(.95); filter: blur(8px) brightness(.6); }
#backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 500ms var(--ease); }
#backdrop.on { opacity: 1; }
#backdrop { transition: opacity 500ms var(--ease), filter 420ms var(--ease); }
#backdrop.low { filter: brightness(.45); }  /* the season rail has focus: the artwork steps back */
#backdrop::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(to right, rgb(15 17 21 / .96), rgb(15 17 21 / 0) 68%), linear-gradient(to top, rgb(15 17 21 / 1), rgb(15 17 21 / 0) 55%); }
#light { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: --pool-x 900ms var(--ease), --pool-c 900ms var(--ease), --base-c 900ms var(--ease), --glow-c 900ms var(--ease), opacity 600ms var(--ease); }
.light-hearth #light { background:
  radial-gradient(ellipse 30% 42% at var(--pool-x) 108%, var(--pool-c) 0%, color-mix(in oklab, var(--pool-c) 45%, transparent) 42%, transparent 100%),
  radial-gradient(ellipse 100% 62% at 50% 122%, var(--base-c) 0%, color-mix(in oklab, var(--base-c) 50%, transparent) 45%, transparent 100%),
  linear-gradient(to bottom, rgb(5 6 8 / .5), rgb(5 6 8 / 0) 44%); }
/* time of day: a warm veil that darkens the whole room, artwork included */
.tok-hearth.tod-evening #stage::after, .tok-hearth.tod-night #stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 40; }
.tok-hearth.tod-evening #stage::after { background: rgb(12 7 2 / .06); }
.tok-hearth.tod-night #stage::after { background: rgb(12 7 2 / .22); }
/* kindle: the short ignition on Home, wake and return */
#kindle { position: absolute; left: 132px; top: 77px; width: 12px; height: 12px; border-radius: 50%; background: var(--ember); z-index: 45; opacity: 0; pointer-events: none; }
#kindle.go { animation: kindle 700ms var(--ease); }
@keyframes kindle { 0% { opacity: 0; transform: scale(.2); box-shadow: 0 0 0 0 oklch(.75 .17 50 / 0); } 25% { opacity: 1; transform: scale(1.8); box-shadow: 0 0 40px 18px oklch(.75 .17 50 / .45); } 100% { opacity: 0; transform: scale(1); box-shadow: 0 0 90px 44px oklch(.75 .17 50 / 0); } }
#light.pulse { animation: lightpulse 900ms var(--ease); }
@keyframes lightpulse { 0% { filter: brightness(1); } 30% { filter: brightness(1.8); } 100% { filter: brightness(1); } }
.light-glow #light { background: radial-gradient(ellipse 62% 72% at 74% 24%, var(--glow-c) 0%, color-mix(in oklab, var(--glow-c) 35%, transparent) 40%, transparent 72%); }
.light-off #light { display: none; }
#stage.navopen .screen.on, #stage.navopen #topbar, #stage.navopen #light { filter: blur(6px) brightness(.45); }
.screen.on, #topbar { transition: opacity 260ms var(--ease), filter 260ms var(--ease); }

/* ---------- top bar ---------- */
#topbar { position: absolute; left: 120px; right: 96px; top: 44px; height: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
#topbar.hidden { opacity: 0; }
.lockup { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; height: 64px; }
.lockup svg { width: 36px; height: 36px; }
.lockup.gone { visibility: hidden; }
.shape-uniform .lockup { background: rgb(255 255 255 / .08); border-radius: 32px; padding: 0 26px 0 20px; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .2); }
.status { display: flex; align-items: center; gap: 28px; font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; margin-left: auto; }
.dl { display: flex; gap: 8px; align-items: center; font-size: 26px; font-weight: 600; color: var(--t2); }
.dl svg { width: 26px; height: 26px; color: var(--ember); stroke-width: 2.6; }
.shape-uniform .dl { background: rgb(255 255 255 / .07); border-radius: 24px; height: 48px; padding: 0 18px; }
.status .wifi { width: 30px; height: 30px; color: var(--t2); }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 260ms var(--ease), visibility 0s 260ms; }
.screen.on { opacity: 1; visibility: visible; transition: opacity 260ms var(--ease), filter 260ms var(--ease); }
.page-title { position: absolute; left: 120px; top: 96px; margin: 0; font-size: 56px; font-weight: 600; line-height: 1.1; }
.tok-current .page-title { font-weight: 800; letter-spacing: -.03em; }

/* typography */
.ct { font-family: Onest, sans-serif; font-weight: 700; letter-spacing: -.025em; }
.serif-literata .ct { font-family: Literata, Georgia, serif; font-weight: 500; letter-spacing: -.01em; font-optical-sizing: auto; }
.serif-source .ct { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; letter-spacing: -.01em; font-optical-sizing: auto; }
/* font lab: the content-title face chosen in the review panel */
.font-custom .ct, .font-custom .ct * { font-variant-numeric: lining-nums; }
.font-custom .ct { font-family: var(--ctf), Georgia, serif !important; font-weight: var(--ctw) !important; letter-spacing: var(--ctt) !important; }
.eyebrow { font-size: 26px; font-weight: 500; color: var(--t2); display: flex; align-items: center; gap: 12px; height: 34px; }
.eyebrow-caps .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ember); flex: none; }
.dot.s { width: 10px; height: 10px; }

/* focus: rim light from below, or the current ring */
.rimbox { position: relative; }
.rimbox::after { content: ''; position: absolute; inset: 0; box-sizing: border-box; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 220ms var(--ease); }
.focus-rim .rimbox::after { padding: 2px;
  background: linear-gradient(to top, oklch(.98 .03 70 / 1), oklch(.97 .02 70 / .30) 45%, oklch(1 0 0 / .06));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.focus-ring .rimbox::after { box-shadow: inset 0 0 0 3px rgb(255 255 255 / .45); }
.lit .rimbox::after, .lit.rimbox::after { opacity: 1; }
.cast { position: absolute; left: 8%; right: 8%; bottom: -30px; height: 34px; border-radius: 50%; background: var(--cast, oklch(.7 .1 60 / .5));
  filter: blur(20px); opacity: 0; transition: opacity 220ms var(--ease); pointer-events: none; z-index: -1; }
.light-hearth.focus-rim .lit .cast { opacity: 1; }
.wide .cast { top: 228px; bottom: auto; }
.poster.small .cast { top: 246px; bottom: auto; }
.poster.big .cast { top: 291px; bottom: auto; }

/* content cards */
.track { display: flex; gap: 32px; padding-left: 120px; width: max-content; transition: transform 300ms var(--ease); }
.row { position: relative; margin-bottom: 40px; transition: opacity 300ms var(--ease); }
.row.faded { opacity: 0; }
.row-label { font-size: 30px; font-weight: 600; margin: 0 0 22px 120px; height: 36px; }
.card { position: relative; flex: none; isolation: isolate; transition: transform 220ms var(--ease); transform-origin: 50% 100%; }
.focus-ring .card { transform-origin: 50% 50%; }
.focus-rim .lit.card { transform: translateY(-8px) scale(1.04); }
.focus-ring .lit.card { transform: translateY(-6px) scale(1.06); }
.art { position: relative; background-size: cover; background-position: center; background-color: #1a1c21; border-radius: 12px; transition: filter 220ms var(--ease), box-shadow 220ms var(--ease); }
.poster .art { border-radius: 10px; }
.shape-uniform .art { border-radius: 26px; }
.shape-uniform .poster .art { border-radius: 20px; }
.art { --r: 12px; }
.poster .art { --r: 10px; }
.focus-rim .art.rimbox::after { inset: -7px; border-radius: calc(var(--r) + 7px); }
.focus-rim .lit .art { box-shadow: 0 0 0 5px rgb(11 12 15 / .95), inset 0 -26px 34px -24px oklch(.95 .04 70 / .45); }
.focus-ring .lit .art { box-shadow: 0 50px 80px -30px rgb(0 0 0 / .9), 0 0 120px 20px var(--cast, transparent); }
.light-hearth .row .art { filter: brightness(.62); }
.light-hearth .row.active .art { filter: brightness(.82); }
.light-hearth .row.active .lit .art { filter: brightness(1); }

.wide { width: 448px; }
.poster.small { width: 180px; }
.poster.big { width: 210px; }
.wide .art { width: 448px; height: 252px; }
.cap { transition: opacity 220ms var(--ease); }
.cap-focus #home .row[data-row="continue"] .lit .cap { opacity: 0; }
.cap .t { font-size: 28px; font-weight: 600; margin-top: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap .s { font-size: 24px; font-weight: 500; color: var(--t2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap .eyebrow { font-size: 24px; height: 28px; margin-top: 16px; }
.cap .eyebrow + .t { margin-top: 4px; }
.prog-line { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ember); border-bottom-left-radius: inherit; box-shadow: 0 -2px 0 rgb(15 17 21 / .6); }
.titlecard { background: linear-gradient(to top, #1F2227, #17191D); display: flex; align-items: flex-end; padding: 18px; box-sizing: border-box; }
.titlecard .tc { font-size: 26px; line-height: 1.15; color: var(--t2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.lit .titlecard .tc { color: var(--t1); }
.shelf-item span:not(.chip):not(.dot) { max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.prog-track { display: none; height: 6px; border-radius: 3px; background: rgb(255 255 255 / .25); margin-top: 14px; position: relative; }
.prog-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ember); }
.art .chip { position: absolute; top: 20px; right: 20px; }
/* current: caption on a gradient over the image */
.shape-uniform .wide .art::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(to top, rgb(10 11 13 / .92), rgb(10 11 13 / 0) 72%); }
.shape-uniform .wide .cap { position: absolute; left: 24px; right: 24px; bottom: 22px; }
.shape-uniform .wide .cap .t { font-size: 30px; margin-top: 0; }
.shape-uniform .wide .cap .eyebrow { margin-top: 0; }
.shape-uniform .prog-line { display: none; }
.shape-uniform .prog-track { display: block; }
.poster.small .art { width: 180px; height: 270px; }
.poster.small .cap .t { font-size: 24px; margin-top: 14px; width: 180px; color: var(--t2); }
.poster.small.lit .cap .t { color: var(--t1); }
.shape-uniform .poster.small .cap { display: none; }

/* monograms */
.chip { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-weight: 600; font-size: 26px; flex: none; transition: background 220ms, color 220ms; }
.mono-color .chip { background: var(--idc); color: #fff; }
.mono-neutral .chip { background: var(--chip); color: var(--t2); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07); }
.mono-neutral .lit .chip { color: var(--t1); background: #25282E; }

/* favourites: shelf */
.shelf { display: flex; gap: 20px; padding-left: 104px; width: max-content; transition: transform 300ms var(--ease); }
.shelf-item { position: relative; display: flex; align-items: center; gap: 18px; height: 88px; padding: 0 28px 0 16px; border-radius: 20px; font-size: 32px; font-weight: 600; color: var(--t2); white-space: nowrap;
  transition: background 220ms var(--ease), color 220ms var(--ease), transform 220ms var(--ease); }
.shelf-item.lit { background: rgb(255 255 255 / .08); color: var(--t1); transform: translateY(-4px); }
.shelf-item .dot { margin-left: -4px; }
.chip.icon svg { width: 30px; height: 30px; color: var(--t2); }
.lit .chip.icon svg { color: var(--t1); }
.chips-icons .shelf-item .chip.letter { display: none; }
.chips-icons .shelf-item { padding-left: 28px; }
.chips-icons .shelf { gap: 28px; }
/* favourites: tiles (calm, current) */
.tile { position: relative; width: 264px; height: 132px; box-sizing: border-box; border-radius: 26px; background: rgb(255 255 255 / .06); display: flex; align-items: center; gap: 18px; padding: 0 24px;
  font-size: 28px; font-weight: 600; flex: none; transition: transform 220ms var(--ease), background 220ms var(--ease); }
.tile span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.lit { background: rgb(255 255 255 / .2); transform: scale(1.08); box-shadow: 0 0 60px 0 var(--cast, transparent); }
.tile .dot.run { position: absolute; top: 16px; right: 16px; width: 12px; height: 12px; }
.shape-roles .tile { border-radius: 18px; background: rgb(255 255 255 / .035); }

/* ---------- Home ---------- */
#home .hero { position: absolute; left: 120px; top: 150px; width: 1400px; height: 240px; transition: opacity 300ms var(--ease); }
#home .hero .ct { font-size: 96px; line-height: 1.12; margin: 8px 0 0; padding-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 1400px; }
.tok-current #home .hero .ct { font-size: 84px; display: block; white-space: nowrap; text-overflow: ellipsis; }  /* the shell today: one line, ellipsis */
#home .hero .meta { margin-top: 10px; font-size: 28px; font-weight: 500; color: var(--t2); }
#home .hero.gone { opacity: 0; }
#home .rows { position: absolute; left: 0; right: 0; top: 404px; transition: transform 420ms var(--ease); }
.rise { transition: opacity 500ms var(--ease), transform 500ms var(--ease) !important; }
#stage.rising .rise { opacity: 0 !important; transform: translateY(24px) !important; }

/* ---------- Library ---------- */
#library .tabs { position: absolute; left: 92px; top: 196px; display: flex; gap: 8px; }
.tab { position: relative; height: 64px; padding: 0 28px; border-radius: 32px; display: flex; align-items: center; font-size: 30px; font-weight: 600; color: var(--t2); transition: background 200ms, color 200ms; }
.tab.sel { color: var(--t1); }
.tab.sel::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--ember); }
.shape-uniform .tab { background: rgb(255 255 255 / .06); }
.shape-uniform .tab.sel::after { width: auto; left: 28px; right: 28px; margin: 0; height: 4px; border-radius: 2px; bottom: 8px; }
.tab.lit { background: var(--t1); color: var(--ink); }
.tab.lit::after { background: var(--ink); }
#library .clip { position: absolute; left: 0; right: 0; top: 276px; bottom: 0; overflow: hidden; }
#library .grid { position: absolute; left: 0; right: 0; top: 24px; transition: transform 400ms var(--ease); }
.grow { display: flex; gap: 40px; padding-left: 120px; margin-bottom: 44px; }
.poster.big .art { width: 210px; height: 315px; }
.poster.big .cap .t { width: 210px; font-size: 26px; line-height: 1.25; font-weight: 500; color: var(--t2); margin-top: 16px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.poster.big.lit .cap .t { color: var(--t1); font-weight: 600; }
.poster.big .cap .s { font-size: 24px; color: var(--t3); }

/* ---------- Detail ---------- */
#detail .wrap { position: absolute; left: 120px; bottom: 140px; width: 1180px; transition: opacity 300ms var(--ease); }
/* series detail: the copy sits at the top, the season rail below it (handoff 07) */
#detail .dflow { position: absolute; left: 0; right: 0; top: 180px; transition: transform 420ms var(--ease); }
#detail .dflow .wrap { position: static; margin-left: 120px; }
#detail .wrap.dim { opacity: .18; }
#detail .rail { margin-top: 64px; }
#detail .rail .tabs { display: flex; gap: 8px; margin: 0 0 30px 92px; }
.ep { width: 420px; }
.ep .art { width: 420px; height: 236px; }
.ep .cap .t { font-size: 26px; }
.seen { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgb(11 12 15 / .72); display: grid; place-items: center; color: var(--t1); }
.seen svg { width: 24px; height: 24px; stroke-width: 2.6; }
/* an episode without its own still: a numbered title card, not the series image again */
.titlecard.epc { flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px 22px 22px; }
.titlecard.epc .num, #detail .titlecard.epc .num { font-size: 76px; line-height: 1; margin: 0; padding: 0; color: var(--t3); display: block; }
.titlecard.epc .tc, #detail .titlecard.epc .tc { font-size: 30px; line-height: 1.15; margin: 0; padding: 0; -webkit-line-clamp: 2; }
.lit .titlecard.epc .num { color: var(--t2); }
/* rows fade out at the left edge: a scrolled card is not cut hard at x 0 */
.shape-roles #home .row, .shape-roles #apps .row, .shape-roles #detail .row {
  -webkit-mask-image: linear-gradient(to right, transparent 24px, #000 112px); mask-image: linear-gradient(to right, transparent 24px, #000 112px);
  padding-bottom: 40px; margin-bottom: 0; }
#detail .ct { font-size: 104px; line-height: 1.08; margin: 12px 0 14px; padding-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tok-current #detail .ct { font-size: 96px; }
#detail .meta { font-size: 28px; font-weight: 500; color: var(--t1); }
#detail .syn { font-size: 28px; line-height: 1.45; color: var(--t2); max-width: 880px; margin-top: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 20px; margin-top: 44px; }
.btn { position: relative; height: 88px; box-sizing: border-box; padding: 0 40px 0 32px; border-radius: 44px; display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; color: var(--t1); white-space: nowrap;
  transition: background 200ms var(--ease), color 200ms var(--ease), transform 200ms var(--ease); }
.btn.primary { background: rgb(255 255 255 / .14); }
.shape-uniform .btn { background: rgb(255 255 255 / .09); }
.shape-roles .btn { background: rgb(255 255 255 / .07); }
.shape-roles .btn.primary { background: rgb(255 255 255 / .14); }
.btn.lit, .shape-roles .btn.lit, .shape-roles .btn.primary.lit { background: var(--t1); color: var(--ink); transform: scale(1.04); }
.btn.sm { height: 72px; font-size: 26px; padding: 0 30px 0 24px; border-radius: 36px; }
.btn.sm svg { width: 30px; height: 30px; }
.progress { display: flex; align-items: center; gap: 20px; margin-top: 30px; font-size: 26px; color: var(--t2); }
.progress .bar { width: 360px; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .12); position: relative; }
.progress .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--ember); }

/* ---------- Applications ---------- */
#apps .groups { position: absolute; left: 0; right: 0; top: 214px; }
#apps .row { margin-bottom: 36px; }
.atile { position: relative; width: 300px; height: 168px; box-sizing: border-box; border-radius: 18px; background: rgb(255 255 255 / .035); padding: 22px 26px; display: flex; flex-direction: column; justify-content: space-between;
  flex: none; isolation: isolate; transition: transform 220ms var(--ease), background 220ms var(--ease); transform-origin: 50% 100%; }
.atile .chip { width: 64px; height: 64px; border-radius: 16px; font-size: 30px; }
.atile .name { font-size: 30px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atile .badge { position: absolute; top: 24px; right: 24px; display: flex; gap: 8px; align-items: center; font-size: 22px; color: var(--t2); }
.atile.lit { background: rgb(255 255 255 / .09); transform: translateY(-8px) scale(1.04); }
.apps-lit .atile::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse 95% 80% at 50% 128%, var(--tint), transparent 72%); opacity: .5; transition: opacity 220ms var(--ease); z-index: -1; }

    ${sel('cap', 'Подпись в фокусе', { show: 'Показывать', hide: 'Скрывать' }, settings.cap)}
    <div class="scenes">${[['home', 'Главная'], ['running', 'Поверх прил.'], ['nav', 'Меню'], ['library', 'Медиатека'], ['apps', 'Приложения'], ['player', 'Плеер'], ['ambient', 'Заставка'], ['startup', 'Запуск']].map(([k, n]) => `<button data-scene="${k}">${n}</button>`).join('')}</div>
    <div class="scenes">${[['tap', 'шаг'], ['edge', 'край'], ['select', 'OK'], ['back', 'назад'], ['open', 'панель'], ['close', 'закрыть'], ['ignite', 'запуск'], ['kindle', 'разгорание'], ['error', 'ошибка']].map(([k, n]) => `<button data-sound="${k}">♪ ${n}</button>`).join('')}</div>
    <div class="keys">Варианты обложек, приложений и полки действуют в «Свете очага». Стрелки, Enter, Esc — назад · M — меню · H — главная (с разгоранием) · A — заставка · S — запуск · D — эта панель. Звук включается после первого нажатия.</div>`;
  $$('select', el).forEach(s => s.onchange = () => {
    const v = s.value, id = s.dataset.id;
    if (id === 'light') settings.lightOn = v === 'on'; else settings[id] = v;
    Sound.arm(); Sound.level(); applyVariant(); s.blur(); Sound.play('select');
  });
  $$('button[data-scene]', el).forEach(b => b.onclick = () => { Sound.arm(); gotoScene(b.dataset.scene); b.blur(); });
  $$('button[data-sound]', el).forEach(b => b.onclick = () => { Sound.arm(); if (settings.sound === 'off') toast('Звуки выключены'); Sound.play(b.dataset.sound); b.blur(); });
}
function gotoScene(name) {
  if (S.nav) closeNav(true);
  if (name === 'startup') return startup();
  const wantRunning = name === 'running' || name === 'nav';
  if (wantRunning !== S.running) { S.running = wantRunning; renderAll(); }
  S.history = [];
  if (name === 'running') show('home', { push: false, focusKey: 'c:activity' });
  else if (name === 'home') show('home', { push: false, focusKey: 'c:harbor' });
  else if (name === 'nav') { show('home', { push: false }); openNav(); }
  else if (name === 'ambient') { S.preAmbient = 'home'; show('ambient', { push: false }); }
  else if (name === 'player') { S.history = ['home', 'detail']; S.detail = 'harbor'; renderDetail(); show('player', { push: false }); Player.open(MEDIA.harbor); if (Q.get('paused') === '1') Player.toggle(); setFocus($('#player .timeline')); }
  else if (name === 'episodes') { S.history = ['home']; S.detail = Q.get('item') && MEDIA[Q.get('item')] ? Q.get('item') : 'keepers'; renderDetail(); show('detail', { push: false }); const c = CURRENT_EP[S.detail]; setFocus($(`#detail [data-key="e:${c ? c[0] + ':' + c[1] : '1:1'}"]`) || $('#detail .ep')); }
  else if (name === 'detail') { S.history = ['home']; S.detail = Q.get('item') && MEDIA[Q.get('item')] ? Q.get('item') : 'harbor'; renderDetail(); show('detail', { push: false, focusKey: 'd:play' }); }
  else { S.history = ['home']; show(name, { push: false }); }
}

/* ---------- input ---------- */
window.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('#hud')) return;
  Sound.arm();
  const code = ev.code, k = ev.key;
  if (S.startup) { ev.preventDefault(); return finishStartup(); }
  if (S.scene === 'ambient') { ev.preventDefault(); return wake(); }
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (dirs[k]) { ev.preventDefault(); if (S.scene === 'player' && playerKey(dirs[k])) return; return move(dirs[k], ev.repeat); }
  if (k === 'Enter' || k === ' ') { ev.preventDefault(); if (S.scene === 'player') Player.show(); return activate(S.focused); }
  if (k === 'Escape' || k === 'Backspace') { ev.preventDefault(); return back(); }
  if (code === 'KeyM' || k === 'ContextMenu') return S.nav ? closeNav() : openNav();
  if (code === 'KeyH') { if (S.nav) closeNav(true); S.history = []; show('home', { push: false }); return kindle(); }
  if (code === 'KeyA') return goAmbient();
  if (code === 'KeyS') return startup();
  if (code === 'KeyD' || k === '`') { const e = $('#hud'); if (Q.get('hud') === '0') return; return e.classList.toggle('on'); }
});
stage.addEventListener('mousemove', ev => {
  const f = ev.target.closest('.f'); if (f && f !== S.focused && S.scope && S.scope.contains(f)) setFocus(f);
});
stage.addEventListener('click', ev => {
  Sound.arm(); if (S.startup) return finishStartup(); if (S.scene === 'ambient') return wake();
  const f = ev.target.closest('.f'); if (f && S.scope && S.scope.contains(f)) { setFocus(f); activate(f); }
});

/* ---------- boot ---------- */
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; scheduleLight(); }
addEventListener('resize', fit); fit();
// A title face that arrives late changes the measured title steps: fit again.
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { if (S.focused && S.scene === 'home') heroFor(S.focused); if (S.scene === 'detail') fitTitle($('#detail .ct'), DETAIL_STEPS); });
S.scope = $('#home');
applyVariant(false);
const startScene = Q.get('scene') || 'home';
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  if (startScene === 'home-long') { gotoScene('home'); setFocus($('[data-key="c:voyage"]')); }
  else if (startScene === 'home-shelf') { gotoScene('home'); setFocus($('[data-key="f:harbortv"]')); }
  else if (startScene === 'home-new') { gotoScene('home'); setFocus($('[data-key="n:bay"]')); }
  else gotoScene(startScene);
  setInterval(() => { $$('.clock').forEach(c => c.textContent = clockText()); }, 15000);
  setInterval(() => { const b = $('#ambient .block'); if (b && S.scene === 'ambient' && P().tok !== 'current') b.style.transform = `translate(${Math.round(Math.random() * 48 - 24)}px, ${Math.round(Math.random() * 48 - 24)}px)`; }, 60000);
});
</script>
</body>
