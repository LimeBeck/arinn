[package]
name = "arinn-platform-x11"
version.workspace = true
publish.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[features]
test-support = []

[[bin]]
name = "arinn-platform-x11"
path = "src/main.rs"

[[bin]]
name = "arinn-xfce-session"
path = "src/bin/arinn-xfce-session.rs"

[[bin]]
name = "arinn-xfce-test-screensaver"
path = "src/bin/arinn-xfce-test-screensaver.rs"
required-features = ["test-support"]

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
arinn-protocol.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
zbus.workspace = true
x11rb = { version = "0.14", features = ["xtest", "composite", "xinput"] }
