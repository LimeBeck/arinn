[package]
name = "arinn-plugin-chrome"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "arinn-plugin-chrome"
path = "src/bin/provider.rs"

[[bin]]
name = "arinn-chrome-host"
path = "src/bin/host.rs"

[dependencies]
anyhow.workspace = true
arinn-protocol.workspace = true
arinn-plugin-sdk.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
zbus.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
url = "2"
html5ever = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
arinnd = { path = "../../crates/arinnd" }
uuid.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process"] }
